[project]
name = "renascor-atlas"
version = "0.1.0"
description = "Open database of persons and places tagged by editors in the TEI editions harvested by Renascor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.2",
    "pyarrow>=16",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
